version: '3.8'

services:
  # Main development environment
  orb-slam2-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: orb-slam2-ssd-semantic:dev
    container_name: orb-slam2-dev
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_HOSTNAME=localhost
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/workspace/orb_slam2_ssd_semantic
      - /dev:/dev
      - orb_slam2_build:/workspace/orb_slam2_ssd_semantic/build
      - orb_slam2_lib:/workspace/orb_slam2_ssd_semantic/lib
    working_dir: /workspace/orb_slam2_ssd_semantic
    stdin_open: true
    tty: true
    command: /bin/zsh

  # Jupyter notebook service for development and visualization
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: orb-slam2-ssd-semantic:dev
    container_name: orb-slam2-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace/orb_slam2_ssd_semantic
      - jupyter_data:/home/jupyter
    working_dir: /workspace/orb_slam2_ssd_semantic
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: >
      bash -c "
        pip install jupyterlab &&
        jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --LabApp.token='' --LabApp.password=''
      "

  # ROS Master service (can be used separately if needed)
  roscore:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: orb-slam2-ssd-semantic:dev
    container_name: orb-slam2-roscore
    network_mode: host
    environment:
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_HOSTNAME=localhost
    command: roscore

  # Optional: RViz for visualization
  rviz:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: orb-slam2-ssd-semantic:dev
    container_name: orb-slam2-rviz
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_HOSTNAME=localhost
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/workspace/orb_slam2_ssd_semantic
    working_dir: /workspace/orb_slam2_ssd_semantic
    command: rviz
    depends_on:
      - roscore

volumes:
  orb_slam2_build:
    driver: local
  orb_slam2_lib:
    driver: local
  jupyter_data:
    driver: local